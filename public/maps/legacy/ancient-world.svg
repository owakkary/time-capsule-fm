<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Parchment gradient background -->
    <linearGradient id="parchmentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF6F0"/>
      <stop offset="50%" style="stop-color:#F5EDE0"/>
      <stop offset="100%" style="stop-color:#F0EBE3"/>
    </linearGradient>

    <!-- Aged paper texture filter -->
    <filter id="paperTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#F5EDE0" surfaceScale="1.5" result="diffLight">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="diffLight" mode="multiply"/>
    </filter>

    <!-- Territory glow filter -->
    <filter id="territoryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Water pattern -->
    <pattern id="waterPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#B8C9D4"/>
      <path d="M0 10 Q5 8, 10 10 T20 10" stroke="#A0B5C4" stroke-width="0.5" fill="none" opacity="0.5"/>
    </pattern>

    <!-- Land texture pattern -->
    <pattern id="landTexture" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#E8DFD0"/>
      <circle cx="5" cy="5" r="0.5" fill="#D4C9B8" opacity="0.3"/>
      <circle cx="20" cy="15" r="0.5" fill="#D4C9B8" opacity="0.3"/>
      <circle cx="10" cy="25" r="0.5" fill="#D4C9B8" opacity="0.3"/>
    </pattern>

    <!-- Border frame gradient -->
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A66B"/>
      <stop offset="50%" style="stop-color:#A6854A"/>
      <stop offset="100%" style="stop-color:#8B7340"/>
    </linearGradient>
  </defs>

  <!-- Background parchment -->
  <rect width="1000" height="600" fill="url(#parchmentBg)"/>

  <!-- Decorative border frame -->
  <rect x="15" y="15" width="970" height="570" fill="none" stroke="url(#frameGradient)" stroke-width="6"/>
  <rect x="25" y="25" width="950" height="550" fill="none" stroke="#C9A66B" stroke-width="2"/>
  <rect x="30" y="30" width="940" height="540" fill="none" stroke="#D4C9B8" stroke-width="1"/>

  <!-- Corner ornaments -->
  <g class="corner-ornament" fill="#C9A66B">
    <!-- Top left -->
    <path d="M40 40 L70 40 L70 45 L45 45 L45 70 L40 70 Z"/>
    <circle cx="55" cy="55" r="3"/>
    <!-- Top right -->
    <path d="M960 40 L930 40 L930 45 L955 45 L955 70 L960 70 Z"/>
    <circle cx="945" cy="55" r="3"/>
    <!-- Bottom left -->
    <path d="M40 560 L70 560 L70 555 L45 555 L45 530 L40 530 Z"/>
    <circle cx="55" cy="545" r="3"/>
    <!-- Bottom right -->
    <path d="M960 560 L930 560 L930 555 L955 555 L955 530 L960 530 Z"/>
    <circle cx="945" cy="545" r="3"/>
  </g>

  <!-- Mediterranean Sea -->
  <path id="mediterranean"
    d="M50 250
       Q100 280, 200 270
       Q300 260, 400 290
       Q500 320, 600 300
       Q700 280, 800 310
       Q850 330, 900 320
       L950 350
       L950 500
       L50 500
       Z"
    fill="url(#waterPattern)"
    stroke="#8BA5B5"
    stroke-width="2"
    opacity="0.7"/>

  <!-- Black Sea -->
  <ellipse cx="750" cy="180" rx="100" ry="50" fill="url(#waterPattern)" stroke="#8BA5B5" stroke-width="1.5" opacity="0.6"/>

  <!-- Red Sea -->
  <path d="M620 400 Q640 450, 660 520 L680 520 Q660 450, 640 400 Z"
    fill="url(#waterPattern)" stroke="#8BA5B5" stroke-width="1" opacity="0.6"/>

  <!-- Persian Gulf -->
  <path d="M820 380 Q860 400, 880 450 L900 440 Q870 390, 830 370 Z"
    fill="url(#waterPattern)" stroke="#8BA5B5" stroke-width="1" opacity="0.6"/>

  <!-- EMPIRE TERRITORIES -->

  <!-- Roman Empire - Western Mediterranean, Italy, Iberia, Gaul -->
  <path id="empire-roman-empire"
    class="territory"
    data-empire="roman-empire"
    d="M80 200
       Q120 150, 200 140
       L280 130
       Q330 120, 380 160
       L420 200
       Q400 250, 350 280
       Q300 300, 250 290
       Q200 280, 150 300
       Q100 290, 80 250
       Z
       M200 310
       Q240 320, 280 310
       Q320 330, 300 370
       Q260 390, 220 380
       Q180 360, 200 310
       Z"
    fill="#C9534D"
    stroke="#8B3A35"
    stroke-width="2"/>

  <!-- Classical Greece - Aegean region, mainland Greece -->
  <path id="empire-classical-greece"
    class="territory"
    data-empire="classical-greece"
    d="M460 180
       Q500 160, 540 170
       L560 200
       Q580 220, 570 260
       Q550 300, 520 310
       Q490 320, 460 300
       L440 260
       Q430 220, 460 180
       Z
       M520 320
       Q540 330, 555 350
       Q545 370, 520 375
       Q500 370, 505 350
       Q510 335, 520 320
       Z"
    fill="#7BA3C9"
    stroke="#5A7A99"
    stroke-width="2"/>

  <!-- Ancient Egypt - Nile valley -->
  <path id="empire-ancient-egypt"
    class="territory"
    data-empire="ancient-egypt"
    d="M560 340
       Q590 330, 620 350
       L640 400
       Q660 450, 650 500
       L620 540
       Q580 550, 550 530
       L530 480
       Q520 430, 540 380
       Q550 350, 560 340
       Z"
    fill="#D4A574"
    stroke="#A67B4C"
    stroke-width="2"/>

  <!-- Persian Empire - Mesopotamia to Central Asia -->
  <path id="empire-persian-empire"
    class="territory"
    data-empire="persian-empire"
    d="M680 150
       Q750 120, 850 130
       L920 160
       Q950 200, 940 280
       L920 350
       Q880 400, 820 420
       L750 430
       Q700 420, 660 380
       L640 330
       Q630 280, 650 230
       Q660 180, 680 150
       Z"
    fill="#8B4513"
    stroke="#5C2E0D"
    stroke-width="2"/>

  <!-- Empire Labels with hand-drawn style -->
  <g class="empire-labels" font-family="Georgia, serif" font-size="14" fill="#5C4033">
    <text x="220" y="220" text-anchor="middle" font-weight="600" letter-spacing="2">ROMAN EMPIRE</text>
    <text x="500" y="250" text-anchor="middle" font-weight="600" letter-spacing="1">GREECE</text>
    <text x="590" y="440" text-anchor="middle" font-weight="600" letter-spacing="1">EGYPT</text>
    <text x="800" y="280" text-anchor="middle" font-weight="600" letter-spacing="2">PERSIAN EMPIRE</text>
  </g>

  <!-- Water labels -->
  <g class="water-labels" font-family="Georgia, serif" font-size="11" fill="#5A7A99" font-style="italic">
    <text x="400" y="350" text-anchor="middle">Mediterranean Sea</text>
    <text x="750" y="185" text-anchor="middle" font-size="9">Black Sea</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(100, 480)">
    <circle cx="0" cy="0" r="35" fill="none" stroke="#C9A66B" stroke-width="2"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#D4C9B8" stroke-width="1"/>
    <!-- Main directions -->
    <path d="M0 -25 L4 -8 L0 -12 L-4 -8 Z" fill="#8B4513"/>
    <path d="M0 25 L4 8 L0 12 L-4 8 Z" fill="#C9A66B"/>
    <path d="M25 0 L8 4 L12 0 L8 -4 Z" fill="#C9A66B"/>
    <path d="M-25 0 L-8 4 L-12 0 L-8 -4 Z" fill="#C9A66B"/>
    <!-- Diagonal directions -->
    <path d="M18 -18 L6 -6 L9 -6 L6 -9 Z" fill="#D4C9B8"/>
    <path d="M-18 -18 L-6 -6 L-9 -6 L-6 -9 Z" fill="#D4C9B8"/>
    <path d="M18 18 L6 6 L9 6 L6 9 Z" fill="#D4C9B8"/>
    <path d="M-18 18 L-6 6 L-9 6 L-6 9 Z" fill="#D4C9B8"/>
    <circle cx="0" cy="0" r="4" fill="#8B4513"/>
    <text x="0" y="-38" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#5C4033" font-weight="bold">N</text>
  </g>

  <!-- Title cartouche -->
  <g transform="translate(500, 60)">
    <rect x="-150" y="-25" width="300" height="50" fill="#FAF6F0" stroke="#C9A66B" stroke-width="2" rx="3"/>
    <rect x="-145" y="-20" width="290" height="40" fill="none" stroke="#D4C9B8" stroke-width="1" rx="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#5C4033" font-weight="bold" letter-spacing="3">THE ANCIENT WORLD</text>
  </g>

  <!-- Date cartouche -->
  <g transform="translate(880, 540)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8B7355" font-style="italic">c. 100 BCE</text>
  </g>
</svg>