<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Parchment gradient background -->
    <linearGradient id="parchmentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF6F0"/>
      <stop offset="50%" style="stop-color:#F5EDE0"/>
      <stop offset="100%" style="stop-color:#F0EBE3"/>
    </linearGradient>

    <!-- Water pattern -->
    <pattern id="waterPattern" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="#B8C9D4"/>
      <path d="M0 12 Q6 10, 12 12 T25 12" stroke="#A0B5C4" stroke-width="0.5" fill="none" opacity="0.4"/>
    </pattern>

    <!-- Border frame gradient -->
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A66B"/>
      <stop offset="50%" style="stop-color:#A6854A"/>
      <stop offset="100%" style="stop-color:#8B7340"/>
    </linearGradient>
  </defs>

  <!-- Background parchment -->
  <rect width="1000" height="600" fill="url(#parchmentBg)"/>

  <!-- Decorative border frame -->
  <rect x="15" y="15" width="970" height="570" fill="none" stroke="url(#frameGradient)" stroke-width="6"/>
  <rect x="25" y="25" width="950" height="550" fill="none" stroke="#C9A66B" stroke-width="2"/>
  <rect x="30" y="30" width="940" height="540" fill="none" stroke="#D4C9B8" stroke-width="1"/>

  <!-- Corner ornaments -->
  <g class="corner-ornament" fill="#C9A66B">
    <!-- Top left -->
    <path d="M40 40 L70 40 L70 45 L45 45 L45 70 L40 70 Z"/>
    <circle cx="55" cy="55" r="3"/>
    <!-- Top right -->
    <path d="M960 40 L930 40 L930 45 L955 45 L955 70 L960 70 Z"/>
    <circle cx="945" cy="55" r="3"/>
    <!-- Bottom left -->
    <path d="M40 560 L70 560 L70 555 L45 555 L45 530 L40 530 Z"/>
    <circle cx="55" cy="545" r="3"/>
    <!-- Bottom right -->
    <path d="M960 560 L930 560 L930 555 L955 555 L955 530 L960 530 Z"/>
    <circle cx="945" cy="545" r="3"/>
  </g>

  <!-- Atlantic Ocean -->
  <rect x="250" y="100" width="200" height="400" fill="url(#waterPattern)" opacity="0.5"/>

  <!-- Pacific Ocean -->
  <rect x="750" y="100" width="200" height="400" fill="url(#waterPattern)" opacity="0.5"/>

  <!-- CONTINENTS BASE (neutral land) -->

  <!-- Europe base -->
  <path d="M420 120 Q480 100, 540 120 L580 150 Q600 180, 590 220 L560 260 Q520 280, 480 270 L440 250 Q410 220, 420 180 Z"
    fill="#E8DFD0" stroke="#C9B89C" stroke-width="1"/>

  <!-- Africa base -->
  <path d="M440 300 Q500 280, 560 300 L600 350 Q620 420, 600 490 L560 540 Q500 560, 450 540 L420 490 Q400 420, 420 350 Z"
    fill="#E8DFD0" stroke="#C9B89C" stroke-width="1"/>

  <!-- Asia base -->
  <path d="M600 120 Q700 100, 820 120 L880 160 Q920 220, 900 300 L860 380 Q800 440, 720 420 L660 380 Q620 320, 630 250 Q640 180, 600 120 Z"
    fill="#E8DFD0" stroke="#C9B89C" stroke-width="1"/>

  <!-- North America base -->
  <path d="M60 120 Q120 100, 200 120 L240 170 Q260 240, 240 320 L200 380 Q140 420, 80 400 L50 340 Q40 260, 50 180 Z"
    fill="#E8DFD0" stroke="#C9B89C" stroke-width="1"/>

  <!-- South America base -->
  <path d="M140 420 Q180 400, 220 420 L260 480 Q280 540, 260 580 L200 600 Q140 590, 120 540 L100 480 Q110 440, 140 420 Z"
    fill="#E8DFD0" stroke="#C9B89C" stroke-width="1"/>

  <!-- EMPIRE TERRITORIES -->

  <!-- British Empire - UK, India, Eastern seaboard colonies -->
  <g id="empire-british-empire" class="territory" data-empire="british-empire">
    <!-- British Isles -->
    <path d="M430 140 Q450 130, 470 140 L480 170 Q475 200, 460 210 L440 200 Q425 180, 430 140 Z"
      fill="#DC143C" stroke="#8B0A1E" stroke-width="2"/>
    <!-- India -->
    <path d="M720 280 Q760 260, 800 280 L820 340 Q830 400, 800 440 L760 460 Q720 450, 700 410 L690 350 Q700 300, 720 280 Z"
      fill="#DC143C" stroke="#8B0A1E" stroke-width="2"/>
    <!-- Eastern seaboard (colonial) -->
    <path d="M180 200 Q200 180, 220 200 L230 260 Q225 320, 210 360 L190 380 Q170 370, 165 330 L160 270 Q165 230, 180 200 Z"
      fill="#DC143C" stroke="#8B0A1E" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- French Empire - France, Caribbean, parts of Africa -->
  <g id="empire-french-empire" class="territory" data-empire="french-empire">
    <!-- France -->
    <path d="M470 180 Q510 170, 530 190 L540 230 Q535 270, 510 280 L480 275 Q460 260, 460 230 Q462 200, 470 180 Z"
      fill="#002654" stroke="#001533" stroke-width="2"/>
    <!-- Caribbean islands -->
    <ellipse cx="260" cy="380" rx="25" ry="15" fill="#002654" stroke="#001533" stroke-width="1.5"/>
    <!-- Louisiana Territory (faded - sold) -->
    <path d="M120 260 Q150 250, 170 270 L175 320 Q165 360, 140 370 L110 360 Q95 330, 100 290 Q105 270, 120 260 Z"
      fill="#002654" stroke="#001533" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Spanish Empire - Iberia, Central/South America -->
  <g id="empire-spanish-empire" class="territory" data-empire="spanish-empire">
    <!-- Iberian Peninsula -->
    <path d="M430 220 Q460 210, 480 230 L485 270 Q475 300, 450 310 L430 300 Q415 280, 420 250 Q425 230, 430 220 Z"
      fill="#F1BF00" stroke="#C49A00" stroke-width="2"/>
    <!-- Central America & Mexico -->
    <path d="M80 340 Q120 320, 160 350 L180 400 Q170 440, 140 460 L100 450 Q70 420, 70 380 Q72 355, 80 340 Z"
      fill="#F1BF00" stroke="#C49A00" stroke-width="2"/>
    <!-- South America (majority) -->
    <path d="M160 460 Q200 440, 240 470 L270 530 Q280 580, 250 600 L180 600 Q130 580, 120 530 L130 480 Q140 460, 160 460 Z"
      fill="#F1BF00" stroke="#C49A00" stroke-width="2"/>
  </g>

  <!-- Qing China -->
  <path id="empire-qing-china"
    class="territory"
    data-empire="qing-china"
    d="M780 160
       Q840 140, 890 170
       L910 230
       Q920 300, 890 360
       L850 400
       Q800 420, 750 390
       L720 340
       Q700 280, 720 220
       Q740 180, 780 160
       Z"
    fill="#FFD700"
    stroke="#C9A800"
    stroke-width="2"/>

  <!-- Revolutionary America (13 Colonies region - highlighted differently from British) -->
  <path id="empire-united-states"
    class="territory"
    data-empire="united-states"
    d="M160 200
       Q185 185, 210 200
       L220 250
       Q215 310, 200 350
       L180 370
       Q160 360, 155 320
       L150 260
       Q152 225, 160 200
       Z"
    fill="#3D5A80"
    stroke="#2A3F59"
    stroke-width="2.5"/>

  <!-- Empire Labels -->
  <g class="empire-labels" font-family="Georgia, serif" font-size="11" fill="#5C4033">
    <text x="455" y="175" text-anchor="middle" font-weight="600" letter-spacing="1">BRITAIN</text>
    <text x="760" y="360" text-anchor="middle" font-weight="600" letter-spacing="1">BRITISH INDIA</text>
    <text x="500" y="230" text-anchor="middle" font-weight="600" letter-spacing="1">FRANCE</text>
    <text x="455" y="265" text-anchor="middle" font-weight="600" letter-spacing="1">SPAIN</text>
    <text x="120" y="410" text-anchor="middle" font-weight="600" font-size="10">NEW SPAIN</text>
    <text x="200" y="530" text-anchor="middle" font-weight="600" font-size="10">SPANISH AMERICA</text>
    <text x="820" y="280" text-anchor="middle" font-weight="600" letter-spacing="2">QING CHINA</text>
    <text x="185" y="290" text-anchor="middle" font-weight="600" font-size="10">UNITED</text>
    <text x="185" y="302" text-anchor="middle" font-weight="600" font-size="10">STATES</text>
  </g>

  <!-- Ocean labels -->
  <g class="water-labels" font-family="Georgia, serif" font-size="12" fill="#5A7A99" font-style="italic">
    <text x="350" y="300" text-anchor="middle">Atlantic</text>
    <text x="350" y="316" text-anchor="middle">Ocean</text>
    <text x="850" y="500" text-anchor="middle">Pacific</text>
    <text x="850" y="516" text-anchor="middle">Ocean</text>
  </g>

  <!-- Compass Rose -->
  <g transform="translate(900, 120)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#C9A66B" stroke-width="2"/>
    <circle cx="0" cy="0" r="25" fill="none" stroke="#D4C9B8" stroke-width="1"/>
    <!-- Main directions -->
    <path d="M0 -20 L3 -6 L0 -10 L-3 -6 Z" fill="#8B4513"/>
    <path d="M0 20 L3 6 L0 10 L-3 6 Z" fill="#C9A66B"/>
    <path d="M20 0 L6 3 L10 0 L6 -3 Z" fill="#C9A66B"/>
    <path d="M-20 0 L-6 3 L-10 0 L-6 -3 Z" fill="#C9A66B"/>
    <!-- Diagonal directions -->
    <path d="M14 -14 L5 -5 L7 -5 L5 -7 Z" fill="#D4C9B8"/>
    <path d="M-14 -14 L-5 -5 L-7 -5 L-5 -7 Z" fill="#D4C9B8"/>
    <path d="M14 14 L5 5 L7 5 L5 7 Z" fill="#D4C9B8"/>
    <path d="M-14 14 L-5 5 L-7 5 L-5 7 Z" fill="#D4C9B8"/>
    <circle cx="0" cy="0" r="3" fill="#8B4513"/>
    <text x="0" y="-34" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#5C4033" font-weight="bold">N</text>
  </g>

  <!-- Title cartouche -->
  <g transform="translate(500, 60)">
    <rect x="-170" y="-25" width="340" height="50" fill="#FAF6F0" stroke="#C9A66B" stroke-width="2" rx="3"/>
    <rect x="-165" y="-20" width="330" height="40" fill="none" stroke="#D4C9B8" stroke-width="1" rx="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#5C4033" font-weight="bold" letter-spacing="3">THE REVOLUTIONARY PERIOD</text>
  </g>

  <!-- Date cartouche -->
  <g transform="translate(100, 540)">
    <text x="0" y="0" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8B7355" font-style="italic">c. 1800 CE</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 140)" class="legend">
    <rect x="-10" y="-10" width="100" height="120" fill="#FAF6F0" fill-opacity="0.9" stroke="#C9A66B" stroke-width="1" rx="2"/>
    <text x="40" y="8" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#5C4033" font-weight="bold">LEGEND</text>
    <rect x="5" y="20" width="12" height="12" fill="#DC143C"/>
    <text x="22" y="30" font-family="Georgia, serif" font-size="8" fill="#5C4033">British</text>
    <rect x="5" y="38" width="12" height="12" fill="#002654"/>
    <text x="22" y="48" font-family="Georgia, serif" font-size="8" fill="#5C4033">French</text>
    <rect x="5" y="56" width="12" height="12" fill="#F1BF00"/>
    <text x="22" y="66" font-family="Georgia, serif" font-size="8" fill="#5C4033">Spanish</text>
    <rect x="5" y="74" width="12" height="12" fill="#FFD700"/>
    <text x="22" y="84" font-family="Georgia, serif" font-size="8" fill="#5C4033">Qing</text>
    <rect x="5" y="92" width="12" height="12" fill="#3D5A80"/>
    <text x="22" y="102" font-family="Georgia, serif" font-size="8" fill="#5C4033">USA</text>
  </g>
</svg>